<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creating Effects with CSS</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!--NAVBAR-->
  <nav class="nav-bar">
    <ul>
      <li><a href="#">Home</a></li>
      <li class="drop">
        <a href="#">Images</a>
        <div class="rollover-menu">
          <a href="#image1">Image 1</a>
          <a href="#image2">Image 2</a>
          <a href="#image3">Image 3</a>
        </div>
      </li>
    </ul>
  </nav>

  <!--IMAGES-->
  <section>
    <div id="image1" class="image-container">
      <img src="images/japan-one.jpg" alt="Mount Fuji and cherry blossoms in Japan">
    </div>
    <div id="image2" class="image-container">
      <img src="images/japan-two.jpg" class="zoom" alt="Japanese temple surrounded by autumn leaves">
    </div>
    <div id="image3" class="image-container circle">
      <img src="images/japan-three.jpg" alt="Traditional Japanese temple gate">
    </div>
  </section>

  <!--FOOTER-->
  <footer>
    <div class="footer-text">
      <p>The Tech Academy &copy;</p>
    </div>
  </footer>
</body>
</html>

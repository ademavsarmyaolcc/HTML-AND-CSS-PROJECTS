<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creating CSS Effects</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page-shell">
    <header class="hero">
      <p class="eyebrow">HTML &amp; CSS PROJECTS</p>
      <h1>Creating CSS Effects</h1>
      <p class="intro">Hover over the images to explore a smooth zoom effect and an animated circle overlay.</p>
    </header>

    <section class="gallery" aria-label="CSS effects gallery">
      <article class="card">
        <div class="image-frame">
          <img src="https://images.unsplash.com/photo-1518791841217-8f162f1e1131?auto=format&fit=crop&w=1000&q=85" alt="Close-up portrait of a cat">
        </div>
        <h2>Image 1</h2>
        <p>A clean image frame to establish the gallery.</p>
      </article>

      <article class="card">
        <div class="image-frame">
          <img class="zoom" src="https://images.unsplash.com/photo-1552053831-71594a27632d?auto=format&fit=crop&w=1000&q=85" alt="Golden retriever looking at the camera">
        </div>
        <h2>Image 2</h2>
        <p>Hover to scale the image smoothly by 50%.</p>
      </article>

      <article class="card">
        <div class="image-frame circle">
          <img src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?auto=format&fit=crop&w=1000&q=85" alt="Dog sitting outdoors">
        </div>
        <h2>Image 3</h2>
        <p>Hover to reveal the animated circle overlay.</p>
      </article>
    </section>
  </main>
</body>
</html>
